# Builds the static site and publishes ./public to GitHub Pages on every push to main.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Served from the custom domain's root (Settings → Pages → Custom domain), no PHP.
      # Without a custom domain (https://<user>.github.io/<repo>/) SITE_BASE would be
      # /${{ github.event.repository.name }}/
      - name: Build
        env:
          SITE_BASE: /
          FORM_MODE: mailto
        run: |
          python build.py
          rm -f public/kuldes.php public/.htaccess

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
